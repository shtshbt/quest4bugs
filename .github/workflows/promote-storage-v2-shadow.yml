name: Promote tested storage v2 integration

on:
  push:
    branches:
      - agent/storage-v2-shadow

permissions:
  contents: write

jobs:
  promote:
    if: contains(github.event.head_commit.message, '[promote-storage-v2]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/storage-v2-shadow
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refuse to patch an already-integrated storage.js
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "storage-v2 Phase 1 shadow mirror" shared/storage.js; then
            echo "storage.js already contains Phase 1 integration; refusing duplicate patch" >&2
            exit 1
          fi

      - name: Apply deterministic Phase 1B/1C/1D patch
        run: node tools/apply_storage_v2_shadow_hook.js

      - name: Validate generated diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- shared/storage.js

      - name: Run full regression suite before commit
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/test_*.js; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

      - name: Commit tested integration to migration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/storage.js
          git diff --cached --quiet && { echo "No storage.js changes to commit" >&2; exit 1; }
          git commit -m "integrate storage v2 shadow mirror"
          git push origin HEAD:agent/storage-v2-shadow
