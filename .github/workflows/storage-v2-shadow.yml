name: Storage v2 shadow tests

on:
  push:
    branches:
      - agent/storage-v2-shadow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1-soak-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Phase 1 integration is present
        shell: bash
        run: |
          set -euo pipefail
          grep -q "storage-v2 Phase 1 shadow mirror" shared/storage.js
          grep -q "shadowStatus:shadowStatus" shared/storage.js
          grep -q "verifyShadow:verifyShadow" shared/storage.js
          grep -q "shadowSnapshotMeta:shadowSnapshotMeta" shared/storage.js

      - name: Check repository diff hygiene
        run: git diff --check

      - name: Run current-source Quest4Bugs Node regression suite
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for f in tests/test_*.js; do
            [ -e "$f" ] || continue
            if [ "$f" = "tests/test_storage_authority_rehearsal_integration.js" ] && ! grep -q "storage-v2 Phase 2 authority rehearsal" shared/storage.js; then continue; fi
            if [ "$f" = "tests/test_storage_authority_switch_preview.js" ] && ! grep -q "storage-v2 Phase 2 read-authority switch (disabled)" shared/storage.js; then continue; fi
            if [ "$f" = "tests/test_storage_soak_metrics_preview.js" ] && ! grep -q "storage-v2 sustained soak metrics" shared/storage.js; then continue; fi
            found=1
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done
          if [ "$found" -ne 1 ]; then
            echo "No tests/test_*.js files found" >&2
            exit 1
          fi

      - name: Guard Phase 1 authority invariant
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'var ok = safeSet(STORE_KEY, serialized)' shared/storage.js
          grep -q '_queueShadow(serialized,_storeGeneration())' shared/storage.js
          if grep -Eq 'Q4BStorageShadow\.(latest|verify)\([^)]*\).*safeSet\(STORE_KEY' shared/storage.js; then
            echo "Potential shadow-to-legacy automatic restore detected" >&2
            exit 1
          fi

  phase2-rehearsal-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Phase 2 rehearsal integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q "storage-v2 Phase 2 authority rehearsal" shared/storage.js
          grep -q '_queueAuthorityCandidate(serialized,_storeGeneration())' shared/storage.js
          grep -q 'authorityCandidateStatus:authorityCandidateStatus' shared/storage.js

      - name: Run rehearsal storage regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/test_storage*.js; do
            [ -e "$f" ] || continue
            if [ "$f" = "tests/test_storage_soak_metrics_preview.js" ] && ! grep -q "storage-v2 sustained soak metrics" shared/storage.js; then continue; fi
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

  phase2-read-switch-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify disabled read-authority switch scaffold
        shell: bash
        run: |
          set -euo pipefail
          grep -q "storage-v2 Phase 2 read-authority switch (disabled)" shared/storage.js
          grep -q 'var __authorityReadsEnabled=false;' shared/storage.js
          grep -q 'AUTHORITY_RESTORE_TXN_KEY="q4b_storage_v2_restore_txn_v1"' shared/storage.js
          grep -q 'authorityReadSwitchEnabled:authorityReadSwitchEnabled' shared/storage.js
          if grep -q 'var __authorityReadsEnabled=true;' shared/storage.js; then
            echo "Read-authority hard gate unexpectedly enabled" >&2
            exit 1
          fi

      - name: Run switch storage regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/test_storage*.js; do
            [ -e "$f" ] || continue
            if [ "$f" = "tests/test_storage_soak_metrics_preview.js" ] && ! grep -q "storage-v2 sustained soak metrics" shared/storage.js; then continue; fi
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

  phase2-soak-metrics-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure automatic soak metrics
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "storage-v2 sustained soak metrics" shared/storage.js; then
            echo "Soak metrics already integrated; validating committed source."
          else
            node tools/apply_storage_v2_soak_metrics.js
          fi

      - name: Validate diagnostics-only behavior
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'SOAK_STATS_KEY="q4b_storage_v2_soak_stats_v1"' shared/storage.js
          grep -q 'storageV2Readiness:storageV2Readiness' shared/storage.js
          grep -q 'automaticPromotion:false' shared/storage.js
          grep -q 'var __authorityReadsEnabled=false;' shared/storage.js

      - name: Run storage regressions with soak metrics
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/test_storage*.js; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

  browser-indexeddb-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sparse checkout browser test inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            shared
            tests/browser

      - name: Locate installed Chromium browser
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-family browser found on runner" >&2
            exit 1
          fi
          echo "bin=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version

      - name: Serve repository over localhost
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/q4b-http.log 2>&1 &
          echo $! > /tmp/q4b-http.pid
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/shared/storage.js >/dev/null && exit 0
            sleep 0.25
          done
          cat /tmp/q4b-http.log >&2
          exit 1

      - name: Run real-browser IndexedDB smoke pages
        env:
          CHROME: ${{ steps.chrome.outputs.bin }}
        shell: bash
        run: |
          set -euo pipefail
          run_page() {
            page="$1"
            needle="$2"
            profile="$(mktemp -d)"
            echo "::group::$page"
            output="$($CHROME --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --user-data-dir="$profile" --virtual-time-budget=7000 --dump-dom \
              "http://127.0.0.1:8765/tests/browser/$page" 2>&1)"
            echo "$output"
            rm -rf "$profile"
            echo "$output" | grep -F "$needle" >/dev/null
            echo "::endgroup::"
          }
          run_page storage_shadow_backfill.html "PASS shadow-backfill"
          run_page storage_shadow_no_reverse_restore.html "PASS no-reverse-restore"
          run_page storage_authority_candidate.html "PASS phase2-authority-candidate"

      - name: Stop localhost server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/q4b-http.pid ]; then kill "$(cat /tmp/q4b-http.pid)" 2>/dev/null || true; fi
