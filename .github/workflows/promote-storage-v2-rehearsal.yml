name: Promote storage v2 rehearsal

on:
  push:
    branches:
      - agent/storage-v2-shadow

permissions:
  contents: write

jobs:
  promote:
    if: contains(github.event.head_commit.message, '[promote-storage-v2-rehearsal]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/storage-v2-shadow
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refuse duplicate rehearsal integration
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "storage-v2 Phase 2 authority rehearsal" shared/storage.js; then
            echo "Phase 2 authority rehearsal already integrated; refusing duplicate patch" >&2
            exit 1
          fi

      - name: Apply deterministic rehearsal patch
        run: node tools/apply_storage_v2_authority_rehearsal.js

      - name: Validate generated diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q "storage-v2 Phase 2 authority rehearsal" shared/storage.js
          grep -q '_queueAuthorityCandidate(serialized,_storeGeneration())' shared/storage.js
          if git diff -- shared/storage.js | grep '^+' | grep -Eq 'authorityCandidate.*safeSet\(STORE_KEY|Q4BStorageAuthorityCandidate.*safeSet\(STORE_KEY'; then
            echo "Potential candidate-to-gameplay restore path detected" >&2
            exit 1
          fi

      - name: Run full regression suite before commit
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/test_*.js; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

      - name: Commit tested rehearsal integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/storage.js
          git diff --cached --quiet && { echo "No storage.js changes to commit" >&2; exit 1; }
          git commit -m "integrate storage v2 authority rehearsal"
          git push origin HEAD:agent/storage-v2-shadow
