name: Promote disabled storage v2 read switch

on:
  push:
    branches:
      - agent/storage-v2-shadow

permissions:
  contents: write

jobs:
  promote:
    if: contains(github.event.head_commit.message, '[promote-storage-v2-read-switch-disabled]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sparse checkout migration inputs
        uses: actions/checkout@v4
        with:
          ref: agent/storage-v2-shadow
          fetch-depth: 1
          sparse-checkout: |
            shared
            tests
            tools
            .github

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refuse duplicate switch scaffold
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "storage-v2 Phase 2 read-authority switch (disabled)" shared/storage.js; then
            echo "Disabled read-authority switch scaffold already integrated" >&2
            exit 1
          fi

      - name: Apply deterministic disabled switch scaffold
        run: node tools/apply_storage_v2_authority_switch_disabled.js

      - name: Validate hard gate and generated diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'var __authorityReadsEnabled=false;' shared/storage.js
          grep -q 'AUTHORITY_RESTORE_TXN_KEY="q4b_storage_v2_restore_txn_v1"' shared/storage.js
          grep -q 'authorityReadSwitchEnabled:authorityReadSwitchEnabled' shared/storage.js
          if grep -q 'var __authorityReadsEnabled=true;' shared/storage.js; then
            echo "Read-authority hard gate unexpectedly enabled" >&2
            exit 1
          fi

      - name: Run storage regression suite before commit
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/test_storage*.js; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

      - name: Commit tested disabled switch scaffold
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/storage.js
          git diff --cached --quiet && { echo "No storage.js changes to commit" >&2; exit 1; }
          git commit -m "integrate disabled storage v2 read-authority switch"
          git push origin HEAD:agent/storage-v2-shadow
