name: Record storage v2 Phase 2 progress

on:
  push:
    branches:
      - agent/storage-v2-shadow

permissions:
  contents: write

jobs:
  record:
    if: contains(github.event.head_commit.message, '[record-storage-v2-phase2-progress]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout tracker inputs
        uses: actions/checkout@v4
        with:
          ref: agent/storage-v2-shadow
          fetch-depth: 1
          sparse-checkout: |
            .claude_plan
            tools
            .github

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update authoritative progress tracker
        run: node tools/record_storage_v2_phase2_rehearsal_progress.js

      - name: Validate tracker diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- .claude_plan/storage_v2_shadow_migration.md

      - name: Commit tracker update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude_plan/storage_v2_shadow_migration.md
          git diff --cached --quiet && { echo "No progress changes to commit" >&2; exit 1; }
          git commit -m "record storage v2 Phase 2 rehearsal progress"
          git push origin HEAD:agent/storage-v2-shadow
